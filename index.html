<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
    
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        color: #333;
    }

    .navbar {
        background-color: #00b3ad;
        color: white;
        padding: 18px 20px;
        font-size: 18px;
    }

    .kalkulator {
        max-width: 680px;
        margin: 20px auto;
        padding: 15px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    h2 {
        margin-top: 0;
        font-size: 22px;
    }

    .kalkulator label {
        display: block;
        margin-top: 16px;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
    }

    .kalkulator input {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        margin-bottom: 2px;
    }

    .kalkulator button {
        margin-top: 18px;
        padding: 12px 22px;
        border: none;
        border-radius: 4px;
        color: white;
        background-color: #288bc9;
        cursor: pointer;
    }

    .kalkulator button:last-child {
        background-color: #28a745;
    }
</style>
</head>
<body>
    <div class="navbar">🧮 Kalkulator Nilai</div>
    
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>
    
    <h2>Cek Bilangan Genap atau Ganjil</h2>
    
<h2>Ubah Warna Halaman</h2>

<button
    type="button"
    style="background-color: lightgreen;"
    onclick="ubahWarnaLatar('lightgreen')">
    Latar Hijau
</button>

<button
    type="button"
    style="background-color: white;"
    onclick="ubahWarnaLatar('white')">
    Latar Putih
</button>

<button
    type="button"
    style="background-color: lightyellow;"
    onclick="ubahWarnaLatar('lightyellow')">
    Latar Kuning
    
<h2>Daftar Menu Makanan</h2>

<label>
    <input type="checkbox" class="menu" value="5000">
    Ayam Goreng — Rp5.000
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="500">
    Tempe — Rp500
</label>
<br>

<label>
    <input type="checkbox" class="menu" value="2500">
    Telur Dadar — Rp2.500
</label>
<br>

<p>Total: Rp<span id="total">0</span></p>


<h2>Kalkulator Nilai Mahasiswa</h2>

<label for="tugas">Nilai Tugas:</label>
<input type="number" id="tugas" min="0" max="100">
<br>

<label for="uts">Nilai UTS:</label>
<input type="number" id="uts" min="0" max="100">
<br>

<label for="uas">Nilai UAS:</label>
<input type="number" id="uas" min="0" max="100">
<br>

<button type="button" onclick="prosesNilai()">
    Hitung Nilai

<h2>Hitung Nilai Sekolah</h2>

<div class="kalkulator">
    <label for="tugas">Rata-rata Nilai Tugas (20 %)</label>
    <input type="number" id="tugas" min="0" max="100" value="78">

    <label for="uts">Nilai UTS (35 %)</label>
    <input type="number" id="uts" min="0" max="100" value="84">

    <label for="uas">Nilai UAS (45 %)</label>
    <input type="number" id="uas" min="0" max="100" value="85">

    <label for="nilaiAkhir">Nilai Akhir</label>
    <input type="text" id="nilaiAkhir" readonly>

    <label for="peringkat">Peringkat Nilai</label>
    <input type="text" id="peringkat" readonly>

    <label for="predikat">Predikat Nilai</label>
    <input type="text" id="predikat" readonly>

    <button type="button" onclick="hitungNilaiSekolah()">Hitung</button>
    <button type="button" onclick="resetNilai()">Reset</button>
</div>
</button>

<p id="hasilNilai"></p>


</button>


    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">

    <button type="button" onclick="cekBilangan()">Periksa</button>

    <p id="hasilBilangan"></p>

    <script src="script.js"></script>
</body>
</html>
